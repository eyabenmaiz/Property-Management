services:

  # ─── INFRA ───────────────────────────────────────────────

  eureka:
    build: ./discovery-service
    container_name: eureka
    ports:
      - "8761:8761"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  proxy:
    build: ./Proxy-Service
    container_name: proxy
    ports:
      - "8080:8080"
    depends_on:
      eureka:
        condition: service_healthy
    networks:
      - microservices-net

  # ─── BASES DE DONNÉES ────────────────────────────────────

  db-contract:
    image: postgres:15-alpine
    container_name: db-contract
    environment:
      POSTGRES_DB: contract_db
      POSTGRES_USER: ${DB_USER:?Copie .env.example en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copie .env.example en .env}
    ports:
      - "5433:5432"
    volumes:
      - db-contract-data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d contract_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-property:
    image: mysql:8.0
    container_name: db-property
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Copie .env.example en .env}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: property_db
    ports:
      - "3307:3306"
    volumes:
      - db-property-data:/var/lib/mysql
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-payment:
    image: mysql:8.0
    container_name: db-payment
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Copie .env.example en .env}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: payment_db
    ports:
      - "3308:3306"
    volumes:
      - db-payment-data:/var/lib/mysql
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── SERVICES MÉTIERS ────────────────────────────────────

  property-service:
    build: ./Property-Service
    container_name: property-service
    environment:
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    ports:
      - "8091:8081"
    depends_on:
      eureka:
        condition: service_healthy
      db-property:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  contract-service:
    build: ./ContractService
    container_name: contract-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_CLOUD_CONFIG_ENABLED=false
    depends_on:
      eureka:
        condition: service_healthy
      db-contract:
        condition: service_healthy
      kafka:
        condition: service_healthy
      property-service:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  payment-service:
    build: ./payment-service
    container_name: payment-service
    environment:
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      eureka:
        condition: service_healthy
      db-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
      contract-service:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── KAFKA ───────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: on-failure
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - microservices-net

  # ─── MONITORING ──────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9093:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - microservices-net
    depends_on:
      property-service:
        condition: service_healthy
      contract-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?Copie .env.example en .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Copie .env.example en .env}
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - microservices-net

# ─── RÉSEAU & VOLUMES ─────────────────────────────────────

networks:
  microservices-net:
    driver: bridge

volumes:
  db-contract-data:
  db-property-data:
  db-payment-data:
  grafana-data: