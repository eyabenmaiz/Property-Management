# Pipeline GitLab CI - PropertyManagement
# Etapes : validate -> build -> package (image Docker)
# Se declenche a chaque push.

stages:
  - validate
  - build
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Un job par service, lances en parallele
.per-service:
  parallel:
    matrix:
      - SERVICE:
          - discovery-service
          - Proxy-Service
          - Property-Service
          - ContractService
          - payment-service

# 1) Le docker-compose est-il valide ?
compose-lint:
  stage: validate
  image: docker:27
  variables:
    GRAFANA_USER: ci
    GRAFANA_PASSWORD: ci-password
    DB_USER: ci
    DB_PASSWORD: ci-password
    DB_ROOT_PASSWORD: ci-password
  script:
    - docker compose config --quiet

# 2) Compilation de chaque service
# Les tests actuels (contextLoads) exigent une base de donnees et Kafka :
# ils sont ignores ici. A remplacer par de vrais tests unitaires.
build:
  extends: .per-service
  stage: build
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven-$SERVICE
    paths:
      - .m2/repository
  script:
    - cd "$SERVICE"
    - mvn -B -ntp clean package -DskipTests

# 3) Construction de l'image et publication sur le GitLab Container Registry
package:
  extends: .per-service
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMG="$CI_REGISTRY_IMAGE/$(echo "$SERVICE" | tr 'A-Z' 'a-z')"
    - docker build -t "$IMG:$CI_COMMIT_SHORT_SHA" "./$SERVICE"
    - docker push "$IMG:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMG:$CI_COMMIT_SHORT_SHA" "$IMG:latest"
        docker push "$IMG:latest"
      fi
